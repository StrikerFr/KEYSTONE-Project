spring:
  application:
    name: keystone-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/keystone}
    username: ${DATABASE_USERNAME:keystone}
    password: ${DATABASE_PASSWORD:keystone123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

keystone:
  jwt:
    secret: ${JWT_SECRET:keystone-dev-secret-at-least-32-chars-long-for-hs256-security}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  sla:
    at-risk-threshold-percent: 20
  storage:
    local-path: ${STORAGE_PATH:./uploads}
    max-file-size-mb: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.keystone: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN