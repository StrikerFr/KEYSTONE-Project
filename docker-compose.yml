version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: keystone-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keystone_db}
      POSTGRES_USER: ${POSTGRES_USER:-keystone_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keystone_secure_pass_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keystone_user} -d ${POSTGRES_DB:-keystone_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: keystone-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-keystone_db}
      DATABASE_USERNAME: ${POSTGRES_USER:-keystone_user}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-keystone_secure_pass_2026}
      JWT_SECRET: ${JWT_SECRET:-9vX8zP2mL7qR4tW1yK6bJ3nF0sH5uD8cA2eG4iM7oP9rS1tV3wY5zB8cE0fH2jL4}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:80}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
